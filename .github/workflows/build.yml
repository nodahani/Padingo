name: Build APKs

on:
  push:
    branches: [ feature/farsi-localization ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      # Smoke-tests the R8/minify config: the release build must keep compiling
      # as proguard rules evolve. The APK stays unsigned, so it is not
      # installable — signing comes later with a keystore.
      - name: Build release APK (unsigned, runs R8)
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pentastic-debug
          path: composeApp/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pentastic-release
          path: composeApp/build/outputs/apk/release/*.apk