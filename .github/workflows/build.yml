name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      # Decodes the base64 release keystore from the repo secrets into
      # $RUNNER_TEMP and exports its path for the build step. With no secret
      # set, nothing is exported and the release APK stays unsigned — exactly
      # like before.
      - name: Prepare release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/padingo-release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/padingo-release.jks" >> "$GITHUB_ENV"
          fi

      # The password/alias env vars are consumed by the release signingConfig
      # in composeApp/build.gradle.kts. When the keystore secrets exist the
      # artifact is signed with the real release key; otherwise this step only
      # smoke-tests the R8/minify config.
      - name: Build release APK (signed when secrets exist, runs R8)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: padingo-debug
          path: composeApp/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: padingo-release
          path: composeApp/build/outputs/apk/release/*.apk
